
  name: Build and Deploy Spring Boot to VPS

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    packages: write

  jobs:
    build-image:
      name: Build and Push Docker Image
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v5

        - name: Setup Java 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
            cache: gradle

        - name: Grant execute permission
          run: chmod +x gradlew

        - name: Run tests
          run: ./gradlew test

        - name: Set lowercase image name
          id: image
          shell: bash
          run: |
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/${{ github.repository }}:latest

    deploy-vps:
      name: Deploy to VPS
      runs-on: ubuntu-latest
      needs: build-image

      steps:
        - name: Set lowercase image name
          id: image
          shell: bash
          run: |
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

        - name: Deploy application through SSH
          uses: appleboy/ssh-action@v1.2.0
          env:
            IMAGE_NAME: ${{ steps.image.outputs.name }}:latest
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ secrets.SSH_PORT }}
            envs: IMAGE_NAME
            script: |
              set -e
              
              docker pull "$IMAGE_NAME"
              
              docker stop springboot-vps-deploy || true
              docker rm springboot-vps-deploy || true
              
              docker run -d \
                --name springboot-vps-deploy \
                --restart unless-stopped \
                -p 8080:8080 \
                "$IMAGE_NAME"
              
              docker ps